apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpl-analytics
  namespace: analytics
  labels:
    app.kubernetes.io/name: dpl-analytics
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dpl-analytics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpl-analytics
    spec:
      serviceAccountName: analytics-service-account
      imagePullSecrets:
        - name: aws-ecr-cred
      containers:
        - name: analytics-microservice
          image: 640494160208.dkr.ecr.us-east-1.amazonaws.com/analytics-service:10a9528c695bf1240f027eb1486790eba7057034
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cfgmap-analytics
            - secretRef:
                name: secrets-analytics
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8005
          startupProbe:
            httpGet:
              path: /health
              port: 8005
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
