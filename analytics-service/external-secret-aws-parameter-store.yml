apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-parameter-store-analytics
  namespace: analytics
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: aws-parameter-store-analytics
    creationPolicy: Owner
  data:
    - secretKey: AWS_SQS_URL
      remoteRef:
        key: "/analytics-service-queue/prod/sqs/AWS_SQS_URL"
    - secretKey: AWS_DYNAMODB_TABLE
      remoteRef:
        key: "/toggle-master-analytics-service/prod/dynamodb/AWS_DYNAMODB_TABLE"
