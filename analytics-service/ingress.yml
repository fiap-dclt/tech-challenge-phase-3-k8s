apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-analytics
  namespace: analytics
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /analytics(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: svc-analytics
                port:
                  number: 8005
