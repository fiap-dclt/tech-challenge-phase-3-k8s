# AUTH SERVICE
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/fiap-dclt/tech-challenge-phase-3-k8s.git"
    targetRevision: HEAD
    path: auth-service
  destination:
    server: "https://kubernetes.default.svc"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
