apiVersion: v1
kind: ConfigMap
metadata:
  name: cfgmap-auth
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  PORT: "8001"
  init.sh: |
    #!/bin/sh
    # Extract the target database name from the URL
    DB_NAME=$(echo "$DATABASE_URL" | awk -F'/' '{print $NF}' | awk -F'?' '{print $1}')

    # Build a base URL pointing to the default 'postgres' DB
    BASE_URL=$(echo "$DATABASE_URL" | sed "s|/$DB_NAME|/postgres|")

    echo "Ensuring database $DB_NAME exists..."
    psql "$BASE_URL" -tc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1 || psql "$BASE_URL" -c "CREATE DATABASE \"$DB_NAME\";"

    echo "Initializing schema..."
    psql "$DATABASE_URL" -f /scripts/init.sql
  init.sql: |
    CREATE TABLE IF NOT EXISTS api_keys (
      id SERIAL PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      
      -- key_hash armazena o hash SHA-256 da chave, que tem 64 caracteres hexadecimais
      key_hash VARCHAR(64) NOT NULL UNIQUE, 
      
      is_active BOOLEAN DEFAULT true,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
