apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpl-auth
  namespace: auth
  labels:
    app.kubernetes.io/name: dpl-auth
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dpl-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpl-auth
    spec:
      containers:
        - name: auth-microservice
          image: 640494160208.dkr.ecr.us-east-1.amazonaws.com/auth-service:0c4e4b225e79aa2c660d5c2e740cbaff3a333b66
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cfgmap-auth
            - secretRef:
                name: aws-combined-auth
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8001
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
