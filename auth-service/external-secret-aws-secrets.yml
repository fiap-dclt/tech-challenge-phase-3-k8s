apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-secrets-auth
  namespace: auth
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: aws-secrets-auth
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "rds-prod-auth-service-secret"
        property: database_url
    - secretKey: MASTER_KEY
      remoteRef:
        key: "toggle-master/prod/master_key"
        property: MASTER_KEY
