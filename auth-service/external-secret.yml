apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-secrets-auth
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h

  target:
    name: aws-combined-auth
    creationPolicy: Owner

    template:
      type: Opaque
      data:
        DATABASE_URL: "{{ .ssm_value }}"
        MASTER_KEY: "{{ .secrets_value }}"

  data:
    - secretKey: ssm_value
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: /auth-service/prod/DATABASE_URL

    - secretKey: secrets_value
      sourceRef:
        storeRef:
          name: aws-secretsmanager
          kind: ClusterSecretStore
      remoteRef:
        key: prod-master-key-secret
