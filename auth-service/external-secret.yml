apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secrets-auth
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store-secretsmanager
    kind: ClusterSecretStore
  target:
    name: secrets-auth
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "rds-prod-auth-service-secret"
        property: database_url
    - secretKey: MASTER_KEY
      remoteRef:
        key: "toggle-master/prod/master_key"
        property: MASTER_KEY
