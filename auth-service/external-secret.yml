apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-secrets-auth
  namespace: auth
spec:
  refreshInterval: 1h

  target:
    name: aws-combined-auth
    creationPolicy: Owner

    template:
      type: Opaque
      data:
        DATABASE_URL: "{{ .ssm_value }}"
        MASTER_KEY: "{{ .secrets_value }}"

  data:
    - secretKey: ssm_value
      remoteRef:
        key: /auth-service/prod/DATABASE_URL
        sourceRef:
          storeRef:
            name: aws-parameter-store
            kind: ClusterSecretStore

    - secretKey: secrets_value
      remoteRef:
        key: prod-master-key-secret
        sourceRef:
          storeRef:
            name: aws-secretsmanager
            kind: ClusterSecretStore
