apiVersion: batch/v1
kind: Job
metadata:
  name: job-auth-db-init
  namespace: auth
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      name: job-auth-db-init
    spec:
      restartPolicy: Never
      containers:
        - name: psql-runner
          image: postgres:15-alpine
          command: ["sh", "-c", 'psql "$DATABASE_URL" -f /scripts/init.sql']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secrets-auth
                  key: DATABASE_URL
          volumeMounts:
            - name: sql-script
              mountPath: /scripts
      volumes:
        - name: sql-script
          configMap:
            name: cfgmap-auth
