apiVersion: batch/v1
kind: Job
metadata:
  name: job-auth-db-init
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  template:
    metadata:
      name: job-auth-db-init
    spec:
      restartPolicy: Never
      containers:
        - name: psql-runner
          image: postgres:18-alpine
          command: ["sh", "/scripts/init.sh"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aws-combined-auth
                  key: DATABASE_URL
          volumeMounts:
            - name: sql-script
              mountPath: /scripts
      volumes:
        - name: sql-script
          configMap:
            name: cfgmap-auth
