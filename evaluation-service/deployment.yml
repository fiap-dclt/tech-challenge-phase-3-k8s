apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpl-evaluation
  namespace: evaluation
  labels:
    app.kubernetes.io/name: dpl-evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dpl-evaluation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpl-evaluation
    spec:
      serviceAccountName: evaluation-service-account
      containers:
        - name: evaluation-microservice
          image: 640494160208.dkr.ecr.us-east-1.amazonaws.com/evaluation-service:f87a055d88724cc2e7948e983d7210079841f608
          imagePullPolicy: IfNotPresent
          # Envia os três sinais via OTLP/HTTP ao Collector central.
          env:
            - name: OTEL_SERVICE_NAME
              value: "evaluation-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=prod,k8s.cluster.name=eks-prod"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
          envFrom:
            - configMapRef:
                name: cfgmap-evaluation
            - secretRef:
                name: aws-parameter-store-evaluation
            - secretRef:
                name: evaluation-service-api-key
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8004
          startupProbe:
            httpGet:
              path: /health
              port: 8004
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
