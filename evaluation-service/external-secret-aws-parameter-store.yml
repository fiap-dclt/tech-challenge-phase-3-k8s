apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-parameter-store-evaluation
  namespace: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: aws-parameter-store-evaluation
    creationPolicy: Owner
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: "/evaluation-service/prod/REDIS_URL"
    - secretKey: AWS_SQS_URL
      remoteRef:
        key: "/analytics-service-queue/prod/sqs/AWS_SQS_URL"
