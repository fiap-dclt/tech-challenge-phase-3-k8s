apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secrets-evaluation
  namespace: evaluation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store-secretsmanager
    kind: ClusterSecretStore
  target:
    name: secrets-evaluation
    creationPolicy: Owner
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: "/evaluation-service/prod/redis/REDIS_URL"
    - secretKey: AWS_SQS_URL
      remoteRef:
        key: "/analytics-service-queue/prod/sqs/AWS_SQS_URL"
