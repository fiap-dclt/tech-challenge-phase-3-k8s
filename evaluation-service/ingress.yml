apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-evaluation
  namespace: evaluation
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /targeting(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: svc-evaluation
                port:
                  number: 8004
