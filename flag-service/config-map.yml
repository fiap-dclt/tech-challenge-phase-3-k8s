apiVersion: v1
kind: ConfigMap
metadata:
  name: cfgmap-flag
  namespace: flag
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  PORT: "8002"
  AUTH_SERVICE_URL: "http://svc-auth.auth.svc.cluster.local:8001"
  init.sh: |
    #!/bin/sh
    # Extract the target database name from the URL
    DB_NAME=$(echo "$DATABASE_URL" | awk -F'/' '{print $NF}' | awk -F'?' '{print $1}')

    # Build a base URL pointing to the default 'postgres' DB
    BASE_URL=$(echo "$DATABASE_URL" | sed "s|/$DB_NAME|/postgres|")

    echo "Ensuring database $DB_NAME exists..."
    psql "$BASE_URL" -tc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1 || psql "$BASE_URL" -c "CREATE DATABASE \"$DB_NAME\";"

    echo "Initializing schema..."
    psql "$DATABASE_URL" -f /scripts/init.sql
  init.sql: |
    CREATE TABLE IF NOT EXISTS flags (
    id SERIAL PRIMARY KEY,

    -- 'name' é a chave de negócio única (ex: 'enable-new-checkout')
    name VARCHAR(100) UNIQUE NOT NULL, 

    description TEXT,

    -- Este é o 'kill switch' global. Se for false, a flag está desativada para todos.
    is_enabled BOOLEAN NOT NULL DEFAULT false,

    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Opcional, mas boa prática: Trigger para atualizar 'updated_at' automaticamente
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    -- Remove o trigger se já existir, para evitar erro na recriação
    DROP TRIGGER IF EXISTS set_timestamp ON flags;

    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON flags
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();
