apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpl-flag
  namespace: flag
  labels:
    app.kubernetes.io/name: dpl-flag
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dpl-flag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpl-flag
    spec:
      containers:
        - name: flag-microservice
          image: 640494160208.dkr.ecr.us-east-1.amazonaws.com/flag-service:de994184127dbb4087ff87bc15c20abcbf8c9a7d
          imagePullPolicy: IfNotPresent
          # Envia os três sinais via OTLP/HTTP ao Collector central.
          env:
            - name: OTEL_SERVICE_NAME
              value: "flag-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=prod,k8s.cluster.name=eks-prod"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_PYTHON_FLASK_EXCLUDED_URLS
              value: "/health"
          envFrom:
            - configMapRef:
                name: cfgmap-flag
            - secretRef:
                name: aws-parameter-store-flag
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8002
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
