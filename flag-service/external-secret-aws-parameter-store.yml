apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-parameter-store-flag
  namespace: flag
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: aws-parameter-store-flag
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "/flag-service/prod/DATABASE_URL"
