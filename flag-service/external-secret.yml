apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secrets-flag
  namespace: flag
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store-secretsmanager
    kind: ClusterSecretStore
  target:
    name: secrets-flag
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "rds-prod-flag-service-secret"
        property: database_url
