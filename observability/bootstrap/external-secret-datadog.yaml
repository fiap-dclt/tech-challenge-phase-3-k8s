# Nunca versionar a API Key; criar SecureString no AWS SSM Parameter Store.
# O IAM da ServiceAccount external-secrets precisa de ssm:GetParameter
# para o ARN do parâmetro indicado em remoteRef.key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: datadog-api-key
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: datadog-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: /toggle-master/prod/datadog/api-key
