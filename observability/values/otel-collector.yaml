# OpenTelemetry Collector é o núcleo de entrada e roteamento da telemetria.
# Recebe métricas/logs/traces via OTLP; não há Grafana Alloy nem Datadog Agent.
# A versão do Collector deve conter receivers, processors e exporters contrib.
fullnameOverride: otel-gateway
mode: deployment
replicaCount: 1

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: "0.165.0"
command:
  name: otelcol-contrib

serviceAccount:
  create: true
  name: otel-gateway

extraEnvs:
  - name: DD_SITE
    value: us5.datadoghq.com # Ajustar para a região da conta (us3, us5, eu etc.).
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: datadog-api-key
        key: api-key

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 640Mi

# Nenhuma porta de host e nenhum volume do sistema operacional do nó.
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: 0
    protocol: TCP

  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: 0
    protocol: TCP

  jaeger-compact:
    enabled: false

  jaeger-thrift:
    enabled: false

  jaeger-grpc:
    enabled: false

  zipkin:
    enabled: false

  metrics:
    enabled: false

  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    hostPort: 0
    protocol: TCP

# CRD ServiceMonitor fornecida por kube-prometheus-stack.
# Faz scrape das métricas de aplicação expostas pelo exporter prometheus.
serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: prometheus
      path: /metrics
      interval: 30s
  extraLabels:
    release: kps

# alternateConfig impede a mistura com os receivers de exemplo do chart.
alternateConfig:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 480
      spike_limit_mib: 120
    resource:
      attributes:
        - key: k8s.cluster.name
          value: eks-prod
          action: insert
        - key: deployment.environment.name
          value: prod
          action: insert
    batch:
      timeout: 5s
      send_batch_size: 512
      send_batch_max_size: 1024

  exporters:
    # Prometheus usa scrape, não ingestão direta por OTLP neste desenho.
    prometheus:
      endpoint: 0.0.0.0:8889
      enable_open_metrics: true
      resource_constant_labels:
        included:
          - service.name
          - deployment.environment.name
          - k8s.cluster.name

    # Loki recebe OTLP em /otlp/v1/logs (o exporter acrescenta /v1/logs).
    otlp_http/loki:
      endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
      compression: gzip
      retry_on_failure:
        enabled: true

    # O Datadog receberá apenas traces; as métricas ficam no Prometheus.
    # compute_stats permite estatísticas básicas do APM no intake de traces.
    otlp_http/datadog:
      endpoint: https://otlp.${env:DD_SITE}
      headers:
        dd-api-key: ${env:DD_API_KEY}
        compute_stats: "true"
      compression: gzip
      retry_on_failure:
        enabled: true

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [health_check]
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [otlp_http/loki]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [otlp_http/datadog]
