apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpl-targeting
  namespace: targeting
  labels:
    app.kubernetes.io/name: dpl-targeting
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dpl-targeting
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpl-targeting
    spec:
      containers:
        - name: targeting-microservice
          image: 640494160208.dkr.ecr.us-east-1.amazonaws.com/targeting-service:b64383d3097555e615b7b14b3f795c3055ae5492
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cfgmap-targeting
            - secretRef:
                name: aws-parameter-store-targeting
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8003
          startupProbe:
            httpGet:
              path: /health
              port: 8003
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
