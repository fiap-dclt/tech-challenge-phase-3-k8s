apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-parameter-store-targeting
  namespace: targeting
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: aws-parameter-store-targeting
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "/targeting-service/prod/DATABASE_URL"
        property: database_url
