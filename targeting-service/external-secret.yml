apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secrets-targeting
  namespace: targeting
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store-secretsmanager
    kind: ClusterSecretStore
  target:
    name: secrets-targeting
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "rds-prod-targeting-service-secret"
        property: database_url
