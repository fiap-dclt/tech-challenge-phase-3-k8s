apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-targeting
  namespace: targeting
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    argocd.argoproj.io/sync-wave: "1"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /targeting(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: svc-targeting
                port:
                  number: 8003
